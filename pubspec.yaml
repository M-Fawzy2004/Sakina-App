name: sakina_app
description: "Sakina (سَكِينَة) - Luxury Spiritual & Quranic Mobile Sanctuary"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  audio_service: ^0.18.18
  audio_session: ^0.1.25
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  device_preview: 1.2.0
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_islamic_icons: ^1.0.2
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.17
  fpdart: ^1.1.1
  freezed_annotation: ^2.4.4
  gal: ^2.3.3
  gap: ^3.0.1
  get_it: ^8.0.3
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  hugeicons: ^1.2.0
  iconsax: ^0.0.8
  intl: ^0.20.2
  just_audio: ^0.10.5
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  sqflite: ^2.4.2

dev_dependencies:
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  # Assets Declaration
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/audio/
    - assets/database/
    - assets/quran_data/
    - assets/azkar/
    - assets/sunnah_books/
