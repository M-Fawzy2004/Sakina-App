name: sakina_app
description: "Sakina (سكينة) - Luxury Spiritual & Quranic Mobile Sanctuary"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture & Functional Programming
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  equatable: ^2.0.7
  fpdart: ^1.1.1
  freezed_annotation: ^2.4.4

  # Networking & Connectivity
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # Storage & Caching
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Audio Engine
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.1.25

  # Responsive & Styling
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  gap: ^3.0.1

  # Routing
  go_router: ^14.8.1

  # Internationalization
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  generate: true

  # Assets Declaration
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/audio/
    - assets/database/
